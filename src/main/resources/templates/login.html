<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<div class="container" style="max-width: 480px;">
    <h2 class="mb-4">Sign in</h2>
    <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
    <div th:if="${param.logout != null}" class="alert alert-info">You have been logged out.</div>
    <div th:if="${param.registered != null}" class="alert alert-success">Registration complete. Please sign in.</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="mt-3">No account? <a href="/register">Register</a></p>
</div>
</body>
</html>
