<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-bubble {
            max-width: 75%;
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Claude Sonnet Chat</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/chat-model}" class="btn btn-outline-primary btn-sm">ChatModel</a>
            <a th:href="@{/prompt-template}" class="btn btn-outline-primary btn-sm">Template</a>
            <a th:href="@{/rag}" class="btn btn-outline-primary btn-sm">RAG</a>
            <a th:href="@{/tools}" class="btn btn-outline-primary btn-sm">Tools</a>
            <a th:href="@{/mcp}" class="btn btn-outline-primary btn-sm">MCP</a>
            <form th:action="@{/reset}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-secondary btn-sm">New conversation</button>
            </form>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-3">
        <div class="card-body" style="min-height: 200px;">
            <p th:if="${#lists.isEmpty(history)}" class="text-muted mb-0">
                Ask Claude anything to get started.
            </p>
            <div th:each="m : ${history}"
                 class="d-flex mb-2"
                 th:classappend="${m.messageType.name() == 'USER'} ? 'justify-content-end' : 'justify-content-start'">
                <div class="chat-bubble rounded-3 px-3 py-2"
                     th:classappend="${m.messageType.name() == 'USER'} ? 'bg-primary text-white' : 'bg-white border'"
                     th:text="${m.text}"></div>
            </div>
        </div>
    </div>

    <form th:action="@{/chat}" method="post" class="d-flex gap-2">
        <textarea name="message" id="prompt" class="form-control" rows="2"
                  placeholder="Type any prompt for Claude... (Enter to send, Shift+Enter for a new line)"
                  required autofocus autocomplete="off"></textarea>
        <button type="submit" class="btn btn-primary align-self-end">Send</button>
    </form>
    <div class="form-text mt-1">Enter to send · Shift+Enter for a new line</div>
</div>
<script>
    document.getElementById('prompt').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            this.form.requestSubmit();
        }
    });
</script>
</body>
</html>
