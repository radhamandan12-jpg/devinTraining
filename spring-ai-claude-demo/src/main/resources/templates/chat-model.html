<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatModel Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">ChatModel API Demo</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Chat</a>
            <a th:href="@{/rag}" class="btn btn-outline-secondary btn-sm">RAG demo</a>
        </div>
    </div>

    <p class="text-muted">
        Single-shot call using the low-level <code>ChatModel.call(Prompt)</code> API —
        builds the message list and <code>ChatOptions</code> manually, and shows the
        full <code>ChatResponse</code> metadata. No conversation memory.
    </p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/chat-model/ask}" method="post">
                <label class="form-label" for="systemPrompt">System prompt <span class="text-muted">(optional)</span></label>
                <textarea name="systemPrompt" id="systemPrompt" class="form-control mb-3" rows="2"
                          th:text="${systemPrompt}"
                          placeholder="e.g. You are a pirate. Answer everything in pirate speak."></textarea>

                <label class="form-label" for="prompt">Prompt</label>
                <textarea name="prompt" id="prompt" class="form-control mb-3" rows="3" required
                          th:text="${prompt}"
                          placeholder="Ask Claude anything..."></textarea>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label" for="temperature">Temperature</label>
                        <input type="number" name="temperature" id="temperature" class="form-control"
                               min="0" max="1" step="0.1" th:value="${temperature} ?: 0.7">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="maxTokens">Max tokens</label>
                        <input type="number" name="maxTokens" id="maxTokens" class="form-control"
                               min="1" step="1" th:value="${maxTokens} ?: 1024">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Call model</button>
            </form>
        </div>
    </div>

    <div th:if="${reply != null}" class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Response</span>
            <span class="d-flex gap-2">
                <span class="badge bg-secondary" th:text="${modelName}">model</span>
                <span class="badge bg-info text-dark"
                      th:text="|in: ${promptTokens} tok|">in</span>
                <span class="badge bg-info text-dark"
                      th:text="|out: ${completionTokens} tok|">out</span>
                <span class="badge bg-dark"
                      th:text="|total: ${totalTokens} tok|">total</span>
            </span>
        </div>
        <div class="card-body" style="white-space: pre-wrap;" th:text="${reply}"></div>
    </div>
</div>
</body>
</html>
