<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PromptTemplate Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">PromptTemplate Demo</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Chat</a>
            <a th:href="@{/chat-model}" class="btn btn-outline-secondary btn-sm">ChatModel</a>
            <a th:href="@{/rag}" class="btn btn-outline-secondary btn-sm">RAG demo</a>
        </div>
    </div>

    <p class="text-muted">
        Write a template with <code>{placeholders}</code>, supply the variables,
        and Spring AI's <code>PromptTemplate</code> renders the final prompt before
        it is sent to the model.
    </p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card mb-3">
        <div class="card-body">
            <form th:action="@{/prompt-template/run}" method="post">
                <label class="form-label" for="template">Prompt template</label>
                <textarea name="template" id="template" class="form-control mb-3" rows="3"
                          required th:text="${template}"></textarea>

                <label class="form-label" for="variables">
                    Variables <span class="text-muted">(one <code>key=value</code> per line)</span>
                </label>
                <textarea name="variables" id="variables" class="form-control mb-3 font-monospace"
                          rows="4" th:text="${variables}"></textarea>

                <button type="submit" class="btn btn-primary">Render &amp; send</button>
            </form>
        </div>
    </div>

    <div th:if="${rendered != null}" class="card mb-3">
        <div class="card-header">Rendered prompt</div>
        <div class="card-body font-monospace" style="white-space: pre-wrap;"
             th:text="${rendered}"></div>
    </div>

    <div th:if="${reply != null}" class="card">
        <div class="card-header">Claude's response</div>
        <div class="card-body" style="white-space: pre-wrap;" th:text="${reply}"></div>
    </div>
</div>
</body>
</html>
