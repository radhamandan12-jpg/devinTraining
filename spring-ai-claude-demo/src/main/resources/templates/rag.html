<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 1000px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">RAG Demo — Embeddings + Cosine Similarity</h1>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">Back to chat</a>
    </div>

    <div th:if="${notice}" class="alert alert-success" th:text="${notice}"></div>

    <div class="row g-3">
        <div class="col-md-5">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Knowledge base (<span th:text="${#lists.size(documents)}">0</span>)</span>
                    <form th:action="@{/rag/clear}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm"
                                th:disabled="${#lists.isEmpty(documents)}">Clear</button>
                    </form>
                </div>
                <div class="card-body">
                    <form th:action="@{/rag/documents}" method="post" class="mb-3">
                        <textarea name="text" class="form-control mb-2" rows="3" required
                                  placeholder="Add a fact or document, e.g. 'Spring AI is a Spring project for building AI applications.'"></textarea>
                        <button type="submit" class="btn btn-primary btn-sm">Embed &amp; store</button>
                    </form>
                    <ul class="list-group list-group-flush">
                        <li th:each="d, s : ${documents}" class="list-group-item px-0">
                            <span class="badge bg-secondary me-2" th:text="${s.count}">1</span>
                            <span th:text="${d.text}"></span>
                        </li>
                    </ul>
                    <p th:if="${#lists.isEmpty(documents)}" class="text-muted mb-0">
                        No documents yet — add a few facts, then run a query.
                    </p>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card">
                <div class="card-header">Query</div>
                <div class="card-body">
                    <form th:action="@{/rag/query}" method="post" class="mb-3">
                        <textarea name="query" class="form-control mb-2" rows="2" required
                                  th:text="${query}"
                                  placeholder="Ask something related to your documents..."></textarea>
                        <div class="d-flex align-items-center gap-3">
                            <button type="submit" class="btn btn-primary btn-sm">Search</button>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="answer"
                                       id="answer" value="true" th:checked="${answer != null}">
                                <label class="form-check-label" for="answer">
                                    Also generate an answer with Claude
                                </label>
                            </div>
                        </div>
                    </form>

                    <div th:if="${results != null}">
                        <h2 class="h6">Top matches by cosine similarity</h2>
                        <p th:if="${#lists.isEmpty(results)}" class="text-muted">
                            No documents to compare against.
                        </p>
                        <div th:each="r : ${results}" class="mb-2">
                            <div class="d-flex justify-content-between">
                                <span th:text="${r.text}"></span>
                                <span class="badge bg-primary ms-2"
                                      th:text="|${#numbers.formatDecimal(r.score * 100, 1, 1)}%|">0%</span>
                            </div>
                            <div class="progress" style="height: 4px;">
                                <div class="progress-bar" role="progressbar"
                                     th:style="|width: ${r.scorePercent}%|"></div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${answer != null}" class="alert alert-info mt-3 mb-0">
                        <strong>Claude:</strong> <span th:text="${answer}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
